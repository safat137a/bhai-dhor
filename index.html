<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ভাই ধর ভাইরে!</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b2a41;--card:#243b5a;--ink:#fff7e6;--acc:#ffb400;--mut:#a9bdd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{overscroll-behavior:none;margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px}
#wrap{position:relative;width:100%;max-width:820px}
canvas{width:100%;display:block;border-radius:14px;background:#8fd3f4;touch-action:none}
.panel{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;background:rgba(27,42,65,.95);padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));text-align:center;overflow:auto}
.panel>:first-child{margin-top:auto}.panel>:last-child{margin-bottom:auto}
.hide{display:none!important}
h1{margin:0;font-size:clamp(22px,5vw,34px)}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.who{background:var(--card);border:3px solid transparent;border-radius:14px;padding:10px;width:150px;cursor:pointer}
.who.sel{border-color:var(--acc)}
.face{width:64px;height:64px;border-radius:50%;background:#e9c9a0 center/cover;margin:0 auto 6px;border:3px solid #fff}
.who input[type=text]{width:100%;background:#16263d;color:var(--ink);border:1px solid #3b5679;border-radius:8px;padding:5px;text-align:center;font:inherit;font-size:14px}
.face.cut{background-color:transparent;background-size:contain;background-repeat:no-repeat;border:0;border-radius:0;width:78px;height:78px}
.role{font-size:13px;margin-top:6px;color:var(--acc)}
.up{display:block;margin-top:6px;font-size:13px;color:var(--acc);text-decoration:underline;cursor:pointer}
.up input{display:none}
button{font:inherit;font-size:18px;font-weight:700;background:var(--acc);color:#3a2a00;border:0;border-radius:12px;padding:10px 26px;cursor:pointer}
button:focus-visible,.who:focus-visible{outline:3px solid #fff;outline-offset:2px}
small{color:var(--mut)}
#hud{position:absolute;top:8px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:700;color:#10243d;font-size:clamp(14px,3.5vw,20px);pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="800" height="400"></canvas>
  <button id="snd" aria-label="সাউন্ড" style="position:absolute;top:34px;right:10px;padding:2px 8px;font-size:16px;z-index:5">🔊</button>
  <div id="hud"><span id="sc">স্কোর: 0</span><span id="hi">সেরা: 0</span></div>

  <div class="panel" id="start">
    <h1>ভাই ধর ভাইরে! 😂</h1>
    <small>কে পালাবে বেছে নাও, অন্যজন তাকে তাড়া করবে। বাধায় ধাক্কা খেলে ভাই কাছে চলে আসে, ধরা পড়লে মজা শুরু!</small>
    <div class="row" id="cards"></div>
    <button id="play">খেলা শুরু</button>
    <button id="shr" style="background:#3b5679;color:#fff;font-size:15px;padding:7px 16px">🔗 বন্ধুদের শেয়ার করো</button>
    <small>লাফ: স্ক্রিনে ট্যাপ / স্পেস / ↑ (দুইবার লাফ দেওয়া যায়)</small>
  </div>

  <div class="panel hide" id="share">
    <h1>বন্ধুদের পাঠাও 🔗</h1>
    <div id="qr" style="background:#fff;padding:10px;border-radius:12px;min-height:60px"></div>
    <small id="lnk" style="word-break:break-all;max-width:90%"></small>
    <div class="row"><button id="copy">লিঙ্ক কপি</button><button id="shx" style="background:#3b5679;color:#fff">ফিরে যাও</button></div>
  </div>

  <div class="panel hide" id="over">
    <h1 id="ovt">ধরা পড়ে গেছ!</h1>
    <div id="ovs" style="white-space:pre-line;line-height:1.5"></div>
    <div class="row"><button id="again">আবার খেলো</button><button id="swap" style="background:#e4572e;color:#fff">ভূমিকা বদলাও</button><button id="menu" style="background:#3b5679;color:#fff">ক্যারেক্টার বদলাও</button></div>
  </div>
</div>

  setFace(i,DEF[i],false,true);

});
function setFace(i,url,save,cut){
  var im=new Image();im.onload=function(){chars[i].img=im;chars[i].src=url;chars[i].cut=!!cut;chars[i].skin=skinOf(im);render();
    if(save){try{localStorage.setItem('face'+i,url);}catch(e){}}};
  im.src=url;
}
function shrink(file,i){
  var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
    var s=Math.min(im.width,im.height),t=document.createElement('canvas');t.width=t.height=200;
    t.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,200,200);
    setFace(i,t.toDataURL('image/jpeg',.85),true);};im.src=r.result;};r.readAsDataURL(file);
}

// --- menu cards ---
var cards=document.getElementById('cards');
function render(){
  cards.innerHTML='';
  chars.forEach(function(c,i){
    var d=document.createElement('div');d.className='who'+(i===sel?' sel':'');d.tabIndex=0;
    d.innerHTML='<div class="face'+(c.cut?' cut':'')+'"'+(c.src?' style="background-image:url('+c.src+')"':'')+'></div>'+
      '<input type="text" maxlength="14" value="'+c.name+'" aria-label="নাম">'+
      '<label class="up">ছবি দাও<input type="file" accept="image/*"></label><div class="role"></div>';
    d.addEventListener('click',function(){sel=i;[].forEach.call(cards.children,function(x,k){x.classList.toggle('sel',k===i);});roles();});
    d.querySelector('input[type=text]').addEventListener('input',function(e){c.name=e.target.value;try{localStorage.setItem('name'+i,c.name);}catch(x){}});
    d.querySelector('input[type=file]').addEventListener('change',function(e){if(e.target.files[0])shrink(e.target.files[0],i);});
    d.querySelector('.up').addEventListener('click',function(e){e.stopPropagation();});
    cards.appendChild(d);
  });
  roles();
}
function roles(){[].forEach.call(cards.children,function(x,k){var r=x.querySelector('.role');if(r)r.textContent=k===sel?'🏃 পালাবে':'😡 তাড়া করবে';});}
render();

var AC=null,muted=false,mus=null,ms=0;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(f,d,ty,v,to,w){var a=ac();if(!a||muted)return;try{var t=a.currentTime+(w||0),o=a.createOscillator(),g=a.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v||.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03);}catch(e){}}
function noise(d,v){var a=ac();if(!a||muted)return;try{var n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),s=b.getChannelData(0);for(var i=0;i<n;i++)s[i]=(Math.random()*2-1)*(1-i/n);var src=a.createBufferSource(),g=a.createGain();g.gain.value=v||.1;src.buffer=b;src.connect(g);g.connect(a.destination);src.start();}catch(e){}}

function spawn(){var t=Math.random(),o;
  if(t<.45)o={w:44,h:44,t:'crate'};else if(t<.8)o={w:34,h:80,t:'pole'};else o={w:90,h:40,t:'bus'};
  o.x=W+20;obs.push(o);if(Math.random()<.4)items.push({x:o.x+o.w/2+50,y:G-(165+Math.random()*30),a:Math.random()*6});nextIn=Math.max(38,(70+Math.random()*60)-spd*2.2);}
function hit(){C.gap-=62;P.inv=70;P.stun=26;shake=10;sfx.hit();say(sel,rnd(['আউউউ!','ধুর!','আহ্ লাগছে!']));}
function update(){
  tick++;score+=spd*.02;spd=Math.min(14,6+score/45);
  P.vy+=.75;P.y+=P.vy;
  if(P.y>=G){if(P.vy>8)dust(P.x,6);P.y=G;P.vy=0;P.jumps=0;}
  if(P.inv>0)P.inv--;if(P.stun>0)P.stun--;
  C.vy+=.75;C.y+=C.vy;if(C.y>=G){C.y=G;C.vy=0;}
  C.gap=Math.min(170,C.gap+.04);
  var cx=P.x-C.gap;
  if(C.y>=G)for(var j=0;j<obs.length;j++){if(obs[j].x>cx+8&&obs[j].x<cx+80){C.vy=-13.5;break;}}
  if(--nextIn<=0)spawn();
  obs.forEach(function(o){o.x-=spd;});
  obs=obs.filter(function(o){return o.x>-120;});
  items.forEach(function(i){i.x-=spd;});items=items.filter(function(i){return i.x>-40;});
  for(var q=items.length-1;q>=0;q--){var it=items[q];if(Math.abs(it.x-P.x)<32&&it.y>P.y-140&&it.y<P.y-8){items.splice(q,1);score+=10;C.gap=Math.min(170,C.gap+24);popText('+১০ 😋',P.x,P.y-150,'#ffd84a');tone(660,.1,'square',.06,990);tone(990,.12,'square',.05,1320,.08);}}
  if(score>=nextMile){popText(nextMile+' পার! 🔥',W/2,95,'#fff');nextMile+=100;}
  clouds.forEach(function(c){c.x-=spd*.2*c.s;if(c.x<-80)c.x=W+60;});
  hills.forEach(function(b){b.x-=spd*.15;if(b.x<-220)b.x=W+100;});
  bld.forEach(function(b){b.x-=spd*.4;if(b.x<-120)b.x=W+Math.random()*30;});
  if(tick%4===0&&P.y>=G)dust(P.x-10,1);
  if(P.inv===0){var px=P.x-16,py=P.y-92,pw=32,ph=88;
    for(var i=0;i<obs.length;i++){var o=obs[i];
      if(px<o.x+o.w-4&&px+pw>o.x+4&&py<G-4&&py+ph>G-o.h+4){obs.splice(i,1);hit();break;}}}
  if(C.gap<=42)return caught();
  if(--bubT<=0){bubT=170+Math.random()*80;if(Math.random()<.5)say(sel,rnd(RL));else say(who(),rnd(CL));}
  document.getElementById('sc').textContent='স্কোর: '+Math.floor(score);
}
function caught(){state='caught';caughtT=0;music(false);if(!play('caught',1))sfx.caught();shake=16;P.vy=-7;confetti(P.x,G-70,60);say(who(),'ধরছি!! 😈');}
function updCaught(){
  caughtT++;C.gap+=(10-C.gap)*.18;
  P.vy+=.75;P.y+=P.vy;if(P.y>=G){P.y=G;P.vy=0;}
  if(caughtT===22){popText('ঠাস!!',P.x-40,G-150,'#ffb400');noise(.12,.18);tone(180,.15,'square',.1,60);}
  if(caughtT===28){say(sel,'ভাই মাফ কর!! 🙏');shake=6;}
  if(caughtT===75)say(who(),'টাকা ফেরত দে!');
  if(caughtT===150)showOver();
}
function showOver(){
  state='over';var s=Math.floor(score),n=[chars[sel].name,chars[who()].name];
  if(s>best){best=s;try{localStorage.setItem('best',best);}catch(e){}}
  document.getElementById('hi').textContent='সেরা: '+best;
  document.getElementById('ovt').textContent=n[1]+' ধরে ফেলেছে '+n[0]+'-কে! 😂';
  var L=[n[1]+' বলছে: "'+n[0]+', এখন তোর পালানো শেষ!"',n[0]+' মাফ চাইছে, কিন্তু '+n[1]+' শুনছেই না 😂','আজকের ট্রিট '+n[0]+'-এর! 🍗','বিরিয়ানি খাওয়াবে '+n[0]+' — ডিল?'];
  document.getElementById('ovs').textContent='স্কোর '+s+' · সেরা '+best+'\n'+rnd(L);
  document.getElementById('over').classList.remove('hide');
}
function skinOf(im){try{var t=document.createElement('canvas');t.width=20;t.height=20;var q=t.getContext('2d');q.drawImage(im,0,0,20,20);var r=0,g=0,b=0,n=0;[[4,10],[13,10]].forEach(function(s){var d=q.getImageData(s[0],s[1],3,3).data;for(var i=0;i<d.length;i+=4){if(d[i+3]>200){r+=d[i];g+=d[i+1];b+=d[i+2];n++;}}});return n?'rgb('+(r/n|0)+','+(g/n|0)+','+(b/n|0)+')':'#e0b48a';}catch(e){return '#e0b48a';}}
function limb(x1,y1,x2,y2,col,w){ctx.strokeStyle='#1b2a41';ctx.lineWidth=w+4;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function drawChar(ci,x,y,air,ph,lean,rot,emo,prop){
  var c=chars[ci],sk=c.skin||'#e0b48a',ol='#1b2a41';
  ctx.save();ctx.translate(x,y);ctx.rotate((rot||0)+(lean||0));ctx.translate(0,air?0:-Math.abs(ph)*3);
  ctx.lineCap='round';ctx.lineJoin='round';
  var lx1=-5+(air?-14:ph*16),ly1=air?-12:-3,lx2=5+(air?14:-ph*16),ly2=air?-18:-3;
  limb(-5,-32,lx1,ly1-4,c.pants,10);limb(5,-32,lx2,ly2-4,c.pants,10);
  ctx.fillStyle='#2b2b3a';ctx.beginPath();ctx.ellipse(lx1+3,ly1,9,5,0,0,7);ctx.ellipse(lx2+3,ly2,9,5,0,0,7);ctx.fill();
  ctx.fillStyle=c.body;ctx.strokeStyle=ol;ctx.lineWidth=3;rr(-18,-76,36,50,12);ctx.fill();ctx.stroke();
  ctx.fillStyle=sk;ctx.beginPath();ctx.moveTo(-6,-76);ctx.lineTo(6,-76);ctx.lineTo(0,-63);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.22)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-63);ctx.lineTo(0,-34);ctx.stroke();
  var sw=air?10:ph*-12,ay=-42+(air?-14:0),ax1=-15-sw-6,ax2=15+sw+6;
  limb(-15,-68,ax1,ay,c.body,8);limb(15,-68,ax2,ay,c.body,8);
  ctx.fillStyle=sk;ctx.strokeStyle=ol;ctx.lineWidth=2;ctx.beginPath();ctx.arc(ax1,ay,5,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(ax2,ay,5,0,7);ctx.fill();ctx.stroke();
  if(prop){ctx.save();ctx.translate(ax2,ay);ctx.rotate(-.9+ph*.6+(state==='caught'?Math.sin(caughtT*.9)*.8:0));ctx.fillStyle='#3b82c4';rr(-4,-26,16,34,8);ctx.fill();ctx.fillStyle='#fff';rr(-1,-23,10,28,5);ctx.fill();ctx.fillStyle='#e63946';ctx.fillRect(-4,-4,16,5);ctx.restore();}
  ctx.fillStyle=sk;rr(-7,-82,14,20,5);ctx.fill();
  ctx.save();ctx.translate(0,-68);if(!air)ctx.rotate(ph*.05);
  if(c.img&&c.cut){var hw=58,hh=hw*c.img.height/c.img.width;ctx.shadowColor='rgba(255,255,255,.95)';ctx.shadowBlur=5;ctx.drawImage(c.img,-hw/2,-hh+4,hw,hh);ctx.shadowBlur=0;ctx.shadowColor='transparent';}
  else{
    ctx.save();ctx.beginPath();ctx.arc(0,-32,24,0,7);ctx.clip();
    if(c.img)ctx.drawImage(c.img,-24,-56,48,48);
    else{ctx.fillStyle=sk;ctx.fillRect(-24,-56,48,48);ctx.fillStyle='#222';ctx.fillRect(-10,-38,5,5);ctx.fillRect(5,-38,5,5);ctx.fillRect(-8,-24,16,3);}
    ctx.restore();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(0,-32,24,0,7);ctx.stroke();
  }
  ctx.restore();
  if(emo){ctx.font='22px sans-serif';ctx.textAlign='left';ctx.fillText(emo,20,-112);}
  ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function shadow(x,y){ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(x,G+3,Math.max(10,24-(G-y)*.06),6,0,0,7);ctx.fill();}
function drawObs(o){
  var y=G-o.h;
  if(o.t==='crate'){ctx.fillStyle='#b5651d';ctx.fillRect(o.x,y,o.w,o.h);ctx.strokeStyle='#7a4210';ctx.lineWidth=3;ctx.strokeRect(o.x+1.5,y+1.5,o.w-3,o.h-3);ctx.beginPath();ctx.moveTo(o.x,y);ctx.lineTo(o.x+o.w,G);ctx.moveTo(o.x+o.w,y);ctx.lineTo(o.x,G);ctx.stroke();}
  else if(o.t==='pole'){ctx.fillStyle='#555';ctx.fillRect(o.x+13,y,8,o.h);ctx.fillStyle='#e63946';ctx.fillRect(o.x,y,o.w,20);ctx.fillStyle='#fff';ctx.fillRect(o.x+4,y+8,o.w-8,4);}
  else{ctx.fillStyle='#2a9d8f';rr(o.x,y,o.w,o.h-8,8);ctx.fill();ctx.fillStyle='#d8f3ff';ctx.fillRect(o.x+8,y+6,18,12);ctx.fillRect(o.x+34,y+6,18,12);ctx.fillRect(o.x+60,y+6,18,12);ctx.fillStyle='#222';ctx.beginPath();ctx.arc(o.x+20,G-4,8,0,7);ctx.arc(o.x+o.w-20,G-4,8,0,7);ctx.fill();}
}
function drawBub(){
  if(!bub)return;var tx,ty;
  if(bub.w===sel){tx=P.x;ty=P.y-158;}else{tx=P.x-C.gap;ty=C.y-158;}
  ctx.font='bold 16px "Hind Siliguri","Noto Sans Bengali",sans-serif';ctx.textAlign='left';
  var w=ctx.measureText(bub.t).width+20,h=28,bx=Math.max(6,Math.min(W-w-6,tx-w/2)),by=Math.max(4,ty-h);
  ctx.fillStyle='#fff';rr(bx,by,w,h,10);ctx.fill();
  ctx.beginPath();ctx.moveTo(tx-6,by+h-1);ctx.lineTo(tx+6,by+h-1);ctx.lineTo(tx,by+h+9);ctx.fill();
  ctx.fillStyle='#1b2a41';ctx.fillText(bub.t,bx+10,by+19);
}
function draw(){
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);}
  var g=ctx.createLinearGradient(0,0,0,G);g.addColorStop(0,'#6ec1ee');g.addColorStop(1,'#ffe9c2');ctx.fillStyle=g;ctx.fillRect(-10,-10,W+20,H+20);
  ctx.fillStyle='rgba(255,230,120,.35)';ctx.beginPath();ctx.arc(W-120,70,52,0,7);ctx.fill();ctx.fillStyle='#ffd84a';ctx.beginPath();ctx.arc(W-120,70,34,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.85)';clouds.forEach(function(c){ctx.beginPath();ctx.ellipse(c.x,c.y,38*c.s,14*c.s,0,0,7);ctx.ellipse(c.x+22*c.s,c.y+4,28*c.s,11*c.s,0,0,7);ctx.fill();});
  ctx.fillStyle='#a6d9a0';hills.forEach(function(b){ctx.beginPath();ctx.ellipse(b.x,G,b.w,b.h,0,Math.PI,0);ctx.fill();});
  bld.forEach(function(b){ctx.fillStyle=b.c;ctx.fillRect(b.x,G-b.h,b.w,b.h);ctx.fillStyle='rgba(255,255,255,.35)';for(var yy=G-b.h+10;yy<G-14;yy+=22)for(var xx=b.x+8;xx<b.x+b.w-10;xx+=20)ctx.fillRect(xx,yy,9,11);});
  ctx.fillStyle='#4a4e57';ctx.fillRect(-10,G,W+20,H-G+10);ctx.fillStyle='#5fb04f';ctx.fillRect(-10,G,W+20,9);ctx.fillStyle='#ffd23f';
  for(var x=-(tick*spd)%80;x<W;x+=80)ctx.fillRect(x,G+40,40,5);
  obs.forEach(drawObs);
  ctx.font='30px sans-serif';ctx.textAlign='center';items.forEach(function(i){ctx.fillText('🍛',i.x,i.y+Math.sin(tick*.1+i.a)*4);});
  var cx=P.x-C.gap,ph=Math.sin(tick*.5),inCaught=state==='caught'||state==='over';
  shadow(cx,C.y);shadow(P.x,P.y);
  drawChar(who(),cx,C.y,C.y<G-4,Math.sin(tick*.5+1),.16,0,'💢',true);
  if(P.inv>0&&Math.floor(tick/4)%2&&!inCaught)ctx.globalAlpha=.45;
  drawChar(sel,P.x,P.y,P.y<G-4&&!inCaught,ph,-.05,inCaught?Math.sin(caughtT*.4)*.3:(P.stun?Math.sin(tick)*.25:0),inCaught?'💫':(P.stun?'💫':'💦'));
  ctx.globalAlpha=1;
  parts.forEach(function(q){ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,q.s,q.s);});
  drawBub();
  ctx.textAlign='center';ctx.font='bold 22px "Hind Siliguri","Noto Sans Bengali",sans-serif';pops.forEach(function(q){ctx.globalAlpha=Math.min(1,q.life/20);ctx.lineWidth=4;ctx.strokeStyle='#1b2a41';ctx.strokeText(q.t,q.x,q.y);ctx.fillStyle=q.c;ctx.fillText(q.t,q.x,q.y);});ctx.globalAlpha=1;
  if(state==='play'&&!everJumped){ctx.textAlign='center';ctx.font='bold 20px "Hind Siliguri","Noto Sans Bengali",sans-serif';ctx.lineWidth=5;ctx.strokeStyle='#1b2a41';ctx.strokeText('স্ক্রিনে ট্যাপ করে লাফ দাও 👆',W/2,G+58);ctx.fillStyle='#fff';ctx.fillText('স্ক্রিনে ট্যাপ করে লাফ দাও 👆',W/2,G+58);}
  if(state==='play'){var d=Math.max(0,Math.min(1,1-(C.gap-42)/128));
    ctx.fillStyle='rgba(0,0,0,.2)';rr(W/2-100,16,200,10,5);ctx.fill();ctx.fillStyle='hsl('+(120-120*d)+',80%,45%)';rr(W/2-100,16,Math.max(8,200*d),10,5);ctx.fill();
    ctx.font='18px sans-serif';ctx.textAlign='left';ctx.fillText('😡',W/2-128,27);}
  if(state==='caught'||state==='over'){var s=Math.min(1,caughtT/12),bp=1+Math.sin(caughtT*.3)*.04;
    ctx.save();ctx.translate(W/2,120);ctx.scale(s*bp,s*bp);ctx.rotate(-.06);ctx.font='900 54px "Hind Siliguri","Noto Sans Bengali",sans-serif';ctx.textAlign='center';ctx.lineWidth=8;ctx.strokeStyle='#1b2a41';ctx.strokeText('ধরা খাইছে!',0,0);ctx.fillStyle='#ffb400';ctx.fillText('ধরা খাইছে!',0,0);ctx.restore();}
  ctx.restore();
}
var lastT=0,acc=0,rt=null;
function step(){
  if(state==='play')update();else if(state==='caught')updCaught();else if(state==='menu')tick++;
  if(bub&&--bub.life<=0)bub=null;
  if(shake>0){shake*=.9;if(shake<.5)shake=0;}
  updParts();
}
function loop(ts){
  if(!lastT)lastT=ts;acc+=Math.min(100,ts-lastT);lastT=ts;
  while(acc>=16.667){step();acc-=16.667;}
  draw();requestAnimationFrame(loop);
}
function fit(){
  var a=innerWidth/Math.max(1,innerHeight),nw=a<1?520:800,nh=a<1?Math.min(760,Math.max(480,Math.round(520/a*.78))):400,ch=(nw!==W||nh!==H);
  W=nw;H=nh;cv.width=W;cv.height=H;G=H-70;
  var cw=Math.max(200,Math.min(innerWidth-20,(innerHeight-20)*W/H))+'px';cv.style.width=cw;document.getElementById('wrap').style.width=cw;
  if(ch){reset();if(state!=='menu'){music(false);stop('caught');state='menu';['over','share'].forEach(function(i){document.getElementById(i).classList.add('hide');});document.getElementById('start').classList.remove('hide');}}
}
addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(fit,150);});
document.addEventListener('visibilitychange',function(){if(document.hidden)stop('bg');else if(state==='play')music(true);});
function start(){reset();state='play';document.getElementById('start').classList.add('hide');document.getElementById('over').classList.add('hide');document.getElementById('sc').textContent='স্কোর: 0';ac();loadAudio();stop('caught');music(true);say(who(),'দাঁড়া ওই!');}
document.getElementById('play').onclick=start;
document.getElementById('again').onclick=start;
document.getElementById('swap').onclick=function(){sel=1-sel;render();start();};
document.getElementById('menu').onclick=function(){state='menu';music(false);stop('caught');render();document.getElementById('over').classList.add('hide');document.getElementById('start').classList.remove('hide');};
var snd=document.getElementById('snd');snd.onclick=function(){this.blur();muted=!muted;snd.textContent=muted?'🔇':'🔊';if(muted){stop('bg');stop('caught');}else if(state==='play')music(true);};
document.addEventListener('pointerdown',function(){ac();loadAudio();},{once:true});
cv.addEventListener('pointerdown',function(e){e.preventDefault();jump();});
addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}});
var LINK='https://claude.ai/artifact/77HrSsFJThcoQ7VJWtbmoR',qrDone=false;
document.getElementById('shr').onclick=function(){
  document.getElementById('start').classList.add('hide');document.getElementById('share').classList.remove('hide');
  document.getElementById('lnk').textContent=LINK;
  if(!qrDone&&window.QRCode){try{new QRCode(document.getElementById('qr'),{text:LINK,width:170,height:170});qrDone=true;}catch(e){}}
};
document.getElementById('shx').onclick=function(){document.getElementById('share').classList.add('hide');document.getElementById('start').classList.remove('hide');};
document.getElementById('copy').onclick=function(){var bt=this;
  function ok(){bt.textContent='কপি হয়েছে ✓';setTimeout(function(){bt.textContent='লিঙ্ক কপি';},1800);}
  try{if(navigator.share){navigator.share({title:'ভাই ধর ভাইরে!',text:'সাজিদ-তানিমের মজার গেম খেলো!',url:LINK}).catch(function(){});return;}}catch(e){}
  try{navigator.clipboard.writeText(LINK).then(ok,function(){});}catch(e){}
};
fit();reset();state='menu';requestAnimationFrame(loop);
})();
